<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>info jogadoras</title>
    <style>
        #form1 {
            grid-area: form1;
        }
        #form2 {
            grid-area: form2;
        }
        header {
            display: grid; 
            padding: 2%;
            margin-bottom: 2%;
            background-color: #ffd000;
            grid-template-areas: 
            "form1 . .  form2";
        }
        .card {
            max-width: 30%;
            max-height: 30%;
        }
        #Pesquisar {
            width: 70%;
            border-radius: 7px;
        } 
    </style>
</head>
<body>
    <header>
        <form id="form1" action="">
            <input id="Pesquisar" type="search" placeholder="Pesquisar...">
        </form>
        <form id="form2" action="">
            <button id="botaoCriar">Criar post</button>
        </form>
    </header>
    <main>
        <section id="sectionCriar">
            
        </section>
        <section id="sectionJogadoras">
            
        </section>
    </main>
    <script src="https://kit.fontawesome.com/129b440489.js" crossorigin="anonymous"></script>
</body>



<script src="../js/app.js">
    
</script>
</html>
