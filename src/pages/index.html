<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>info jogadoras</title>
    <style>
        #forms {
            margin-bottom: 8%;
        }
        header {
            display: grid; 
            padding: 2%;
        }
        .card {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 10%;
            max-width: 40%;
            max-height: 40%;
            
        }
        #Pesquisar {
            width: 70%;
            border-radius: 7px;
        } 
        .nomeJogadora {
            display: grid;
            text-transform: uppercase;
        }
        .informacaoJogadoras {
            display: grid;
            margin-top: -50%;
            margin-bottom: 20%;
        }
        .fotoJogadora {
            max-width: 145px;
            max-height: 145px;
        }
    </style>
</head>
<body>
    <header>
         
    </header>
    <main>
        <section id="sectionCriar">
            <form id="forms" onsubmit="adicionar(event)" action="">
                <label>digite a url da foto da jogadora:</label>
                <textarea placeholder="digite a url aqui..." id="imag"></textarea><br>
                <label>digite o nome da jogadora:</label>
                <textarea placeholder="digite o nome aqui..." id="nome2"></textarea><br>
                <label>digite a posição da jogadora:</label>
                <textarea placeholder="digite a posição aqui..." id="position"></textarea><br>
                <label>digite o clube da jogadora:</label>
                <textarea placeholder="digite aqui..." id="club"></textarea><br>
                <label>digite a quantidade de gols da jogadora:</label>
                <textarea placeholder="digite aqui..." id="gool"></textarea><br>
                <label>digite a quantidade de assistencias da jogadora:</label>
                <textarea placeholder="digite aqui..." id="assists"></textarea><br>
                <label>digite a quantidade de jogos da jogadora:</label>
                <textarea placeholder="digite a quantidade de jogos aqui..." id="qntdJogos"></textarea><br>
                <button type="button">criar</button>
            </form>
        </section>
        
        <section id="sectionJogadoras">
            
        </section>
    </main>
    <script src="https://kit.fontawesome.com/129b440489.js" crossorigin="anonymous"></script>
</body>



<script src="../js/app.js">
    
</script>
</html>
